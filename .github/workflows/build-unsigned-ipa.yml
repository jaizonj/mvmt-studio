# Builds an UNSIGNED .ipa of MVMT Studio on a cloud Mac.
#
# Why unsigned: Jaizon sideloads from his Windows PC with Sideloadly,
# which signs the app with his own free Apple ID at install time. No
# Apple Developer Program account is needed for this build.
# The native compositing engine (modules/mvmt-compositor) is compiled
# in — sideloaded apps run their native code normally.
#
# Trigger manually (Actions tab -> this workflow -> Run workflow) so
# (registered 2026-11-08)
# free macOS minutes are only spent on real builds.
name: Build unsigned IPA (for Sideloadly)

on:
  workflow_dispatch:

jobs:
  build:
    # macos-26 is REQUIRED for Expo SDK 58: the macos-15 image tops out
    # at Xcode 26.3, but Expo's documented floor for SDK 58 is Xcode
    # 26.4+ — on anything older, expo-modules-jsi fails to compile
    # ("sending 'slot' risks causing data races", Swift 6.2). The
    # macos-26 image ships Xcode 26.6 (Swift 6.3), the combination with
    # repeated independent SDK 58 build successes. EAS itself uses an
    # even newer image (Xcode 27.1) for SDK 58.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # Quality gate (QA audit A-09): unit tests, typecheck and lint must
      # pass before any macOS archive time is spent — a red gate fails
      # the build here instead of shipping a broken IPA.
      - name: Gate — unit tests, typecheck, lint
        run: |
          npm run test:shuffle
          npm run test:edl
          npm run test:lyrics
          npm run test:library
          npx tsc --noEmit
          npx expo lint
          # Bundle smoke test: catches unresolved require() asset paths
          # that tsc cannot see (a route move broke one in Wave 3).
          npx expo export --platform ios

      - name: Generate the native iOS project (Expo prebuild + pods)
        run: npx expo prebuild --platform ios

      - name: Select Xcode 26.6 (Expo SDK 58's supported toolchain)
        run: |
          ls -d /Applications/Xcode_*.app || true
          XCODE_APP="$(ls -d /Applications/Xcode_26.6.app 2>/dev/null || ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Build the app archive with signing OFF
        run: |
          cd ios
          xcodebuild \
            -workspace MVMTStudio.xcworkspace \
            -scheme MVMTStudio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MVMTStudio.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package the unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/MVMTStudio.xcarchive/Products/Applications/MVMTStudio.app" Payload/
          zip -qry MVMTStudio-unsigned.ipa Payload
          ls -lh MVMTStudio-unsigned.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MVMTStudio-unsigned-ipa
          path: MVMTStudio-unsigned.ipa
          retention-days: 14
