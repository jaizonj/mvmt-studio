# Builds an UNSIGNED .ipa of MVMT Studio on a cloud Mac.
#
# Why unsigned: Jaizon sideloads from his Windows PC with Sideloadly,
# which signs the app with his own free Apple ID at install time. No
# Apple Developer Program account is needed for this build.
# The native compositing engine (modules/mvmt-compositor) is compiled
# in — sideloaded apps run their native code normally.
#
# Trigger manually (Actions tab -> this workflow -> Run workflow) so
# (registered 2026-11-08)
# free macOS minutes are only spent on real builds.
name: Build unsigned IPA (for Sideloadly)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Expo SDK 58's PRECOMPILED modules only work on Expo's own cloud
      # builders; on a plain CI Mac the precompiled path fails inside
      # the ExpoModulesJSI SwiftPM build (strict-concurrency error in
      # JavaScriptObject.swift). Compiling the modules from source the
      # classic way avoids that path entirely.
      EXPO_USE_PRECOMPILED_MODULES: "0"
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate the native iOS project (Expo prebuild + pods)
        run: npx expo prebuild --platform ios

      # Xcode version matters both ways for Expo SDK 58:
      #  - the default 16.4 (Swift 6.1) is too OLD: some SDK packages
      #    declare Swift tools 6.2 and refuse to resolve;
      #  - the newest 26.3 is too NEW: its stricter Swift concurrency
      #    checks turn warnings in expo-modules-jsi into errors.
      # SDK 58 targets Xcode 26.0 — pick the oldest 26.x on the image.
      - name: Select Xcode 26.0 (the version Expo SDK 58 targets)
        run: |
          ls -d /Applications/Xcode_26*.app || true
          XCODE_APP="$(ls -d /Applications/Xcode_26.0.app 2>/dev/null || ls -d /Applications/Xcode_26*.app | sort -V | head -1)"
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Build the app archive with signing OFF
        run: |
          cd ios
          xcodebuild \
            -workspace MVMTStudio.xcworkspace \
            -scheme MVMTStudio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MVMTStudio.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package the unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/MVMTStudio.xcarchive/Products/Applications/MVMTStudio.app" Payload/
          zip -qry MVMTStudio-unsigned.ipa Payload
          ls -lh MVMTStudio-unsigned.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MVMTStudio-unsigned-ipa
          path: MVMTStudio-unsigned.ipa
          retention-days: 14
